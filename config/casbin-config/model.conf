[request_definition]
r = sub, obj, act

[policy_definition]
p = priority, sub, obj, act, eft

[role_definition]
g = _, _

[policy_effect]
e = priority(p.eft) || deny

[matchers]
m = (r.sub.id == p.sub && keyMatch3(r.obj, p.obj) && regexMatch(r.act, p.act)) ||(r.sub.role == p.sub && keyMatch3(r.obj, p.obj) && regexMatch(r.act, p.act))||( g(r.sub.role, p.sub)&& p.eft == "deny" && keyMatch3(r.obj, p.obj) && regexMatch(r.act, p.act))